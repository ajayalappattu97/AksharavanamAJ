<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>അക്ഷര വനം</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#6ec6ff;--bg2:#d9f7c4;--h1:#8fe07a;--h2:#58cc6e;--h3:#33a95c;--card:#fff;--ink:#2b2d5b;--pri:#ff7a2f;--ok:#2fb344;--bad:#e5484d;--tile:#ffe066;--slot:#eef3ff;--ln:#c5d0f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2a5a;--bg2:#17331f;--h1:#1f5a3a;--h2:#17472e;--h3:#103822;--card:#27315c;--ink:#fff;--slot:#1c244a;--ln:#4a5a9a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Noto Sans Malayalam','Manjari','Kartika',system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2));overflow-x:hidden}
.cloud{position:fixed;font-size:56px;opacity:.7;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.wrap{max-width:720px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:clamp(22px,6vw,34px);margin:0;font-weight:800}
.owl{font-size:48px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.stars{background:var(--card);border-radius:30px;padding:6px 16px;font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--ln)}
nav{display:flex;gap:8px;margin:12px 0}
nav button{flex:1;padding:12px 4px;font:inherit;font-weight:800;font-size:clamp(13px,3.8vw,18px);border:0;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ln);cursor:pointer}
nav button.on{background:var(--pri);color:#fff;box-shadow:0 4px 0 #c24f10}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 0 var(--ln);text-align:center}
.pic{font-size:clamp(70px,22vw,120px);display:inline-block;animation:bob 2.4s ease-in-out infinite;line-height:1.1}
.model{font-size:clamp(34px,11vw,60px);font-weight:800;color:var(--pri);margin:4px 0}
.big{border:0;border-radius:50px;padding:12px 26px;font:inherit;font-weight:800;font-size:20px;color:#fff;background:var(--ok);box-shadow:0 5px 0 #1f7d30;cursor:pointer;margin:4px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #1f7d30}
.big.alt{background:#6c5ce7;box-shadow:0 5px 0 #4636b5}
.big.gray{background:#8b93b8;box-shadow:0 5px 0 #5f6788}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.slot,.tile{min-width:clamp(52px,16vw,78px);height:clamp(62px,18vw,86px);border-radius:18px;font:inherit;font-weight:800;font-size:clamp(28px,9vw,44px);display:flex;align-items:center;justify-content:center;padding:0 8px}
.slot{background:var(--slot);border:3px dashed var(--ln);color:var(--ink);cursor:pointer}
.slot.f{border-style:solid;background:#fff6c2;color:#2b2d5b}
.tile{border:0;background:var(--tile);color:#2b2d5b;box-shadow:0 5px 0 #d9a900;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.92)}.tile.used{visibility:hidden}
.shake{animation:shake .5s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{min-height:40px;font-size:clamp(20px,6vw,28px);font-weight:800}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.cf{position:fixed;top:-40px;font-size:30px;animation:fall 2.2s ease-in forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
input,textarea{width:100%;font:inherit;font-size:clamp(24px,7vw,34px);border:3px solid var(--ln);border-radius:18px;padding:10px;background:var(--slot);color:var(--ink)}
textarea{font-size:18px;min-height:150px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;margin:6px 0}
.pal button{width:100%;min-height:54px;padding:6px 2px;line-height:1.6;white-space:nowrap;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:22px;background:var(--tile);color:#2b2d5b;box-shadow:0 3px 0 #d9a900;cursor:pointer}
.lab{font-weight:800;text-align:left;margin-top:8px}
small{opacity:.8}
.ph{width:clamp(96px,30vw,150px);height:clamp(96px,30vw,150px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(52px,17vw,84px);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);box-shadow:0 8px 0 rgba(0,0,0,.12);animation:bob 2.4s ease-in-out infinite}
.sm{transform:scale(.7);margin:-14px 0}
.cloud{z-index:-1}
.tile:nth-child(4n+2){background:#8ff0a4;box-shadow:0 5px 0 #3fb860}.tile:nth-child(4n+3){background:#9ad7ff;box-shadow:0 5px 0 #4a9be0}.tile:nth-child(4n){background:#ffb3c7;box-shadow:0 5px 0 #e0678a}
.model span{display:inline-block;animation:pop .6s both}.model span:nth-child(2){animation-delay:.1s}.model span:nth-child(3){animation-delay:.2s}.model span:nth-child(4){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.card{border:4px solid #fff}
footer{text-align:center;font-size:11px;opacity:.75;margin:18px 0 8px}
.scene{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:5%;right:7%;width:84px;height:84px;border-radius:50%;background:radial-gradient(#fff8b0,#ffd93d);box-shadow:0 0 50px 18px rgba(255,217,61,.55);animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.1)}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:40%}
.gr{position:absolute;bottom:1%;left:0;right:0;display:flex;justify-content:space-around;font-size:34px}
.cv{position:relative;background:#fff;border-radius:24px;max-width:360px;aspect-ratio:1;margin:8px auto;box-shadow:inset 0 0 0 4px var(--ln)}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}#cd{touch-action:none;cursor:crosshair}
nav button{font-size:clamp(12px,3.4vw,17px)!important;padding:10px 2px!important}
[hidden]{display:none!important}
</style>
</head>

const BASE=`അമ്മ|👩,അച്ഛൻ|👨,ആന|🐘,മരം|🌳,മഴ|🌧️,പൂവ്|🌸,കിളി|🐦,അപ്പൂപ്പൻ|👴,അമ്മൂമ്മ|👵,അരി|🍚,ഉപ്പ്|🧂,എലി|🐭,ഇല|🍃,ഈച്ച|🪰,ആട്|🐐,മാൻ|🦌,പശു|🐄,പൂച്ച|🐱,നായ|🐶,മീൻ|🐟,താറാവ്|🦆,കോഴി|🐔,തത്ത|🦜,മുട്ട|🥚,പാൽ|🥛,പഴം|🍌,ചക്ക|🍈,മാങ്ങ|🥭,തേൻ|🍯,ചോറ്|🍛,വീട്|🏠,കാട്|🌲,പുഴ|🏞️,കടൽ|🌊,മല|⛰️,കല്ല്|🪨,കൈ|✋,കാൽ|🦶,കണ്ണ്|👁️,മൂക്ക്|👃,ചെവി|👂,പല്ല്|🦷,കുട്ടി|🧒,പാവ|🪆,കുട|☂️,കപ്പ്|🥤,തൊപ്പി|🧢,ബാഗ്|🎒,പേന|🖊️,പുസ്തകം|📖,കസേര|🪑,നക്ഷത്രം|⭐,സൂര്യൻ|☀️,കാറ്റ്|💨,മിന്നൽ|⚡,മേഘം|☁️,തുള്ളി|💧,പൂമ്പാറ്റ|🦋,വണ്ട്|🪲,ഉറുമ്പ്|🐜,തേനീച്ച|🐝,മയിൽ|🦚,തവള|🐸,പാമ്പ്|🐍,മുയൽ|🐰,ചെടി|🌱,തോണി|🛶,ഒട്ടകം|🐪,കുരങ്ങ്|🐒,പുലി|🐆,തെങ്ങ്|🌴,തേങ്ങ|🥥,തക്കാളി|🍅,ബലൂൺ|🎈,മണി|🔔,പട്ടം|🪁,പന്ത്|⚽,ചായ|☕,കപ്പൽ|🚢,മോതിരം|💍,ചന്ദനം,അടി,ഉറ,ഉടുപ്പ്,ഓല,വഴി,പാടം,മണ്ണ്,മുടി,നഖം,വയർ,ചേച്ചി,ചേട്ടൻ,അനിയൻ,അനിയത്തി,മുത്ത്,വടി,പാത്രം,ചെരുപ്പ്,കടലാസ്,മേശ,നിലാവ്,കഞ്ഞി,അപ്പം,വാഴ`.split(',');
const custom=[];
let stars=0;try{stars=+localStorage.getItem('mls')||0}catch(e){}
const EM={ഉടുപ്പ്:'👗',വഴി:'🛣️',പാടം:'🌾',മണ്ണ്:'🟫',മുടി:'💇',ചേച്ചി:'👧',ചേട്ടൻ:'👦',അനിയൻ:'🧒',അനിയത്തി:'👧',മുത്ത്:'🦪',വടി:'🦯',പാത്രം:'🍲',ചെരുപ്പ്:'🩴',കടലാസ്:'📄',നിലാവ്:'🌕',കഞ്ഞി:'🥣',അപ്പം:'🥞',വാഴ:'🍌',ഓല:'🌴',ചന്ദനം:'🪵',നഖം:'💅',അടി:'👣'};
const parse=s=>{const[a,b]=s.split('|');const w=a.trim();return{w:w,e:(b||EM[w]||'').trim()}};
const words=()=>BASE.map(parse).concat(custom);
const SEG=/[\u0D15-\u0D3A](?:\u0D4D[\u0D15-\u0D3A])*[\u0D3E-\u0D4D\u0D57]?[\u0D02\u0D03]?|[\u0D05-\u0D14\u0D7A-\u0D7F][\u0D02\u0D03]?|[^]/gu;
const ak=w=>w.match(SEG)||[w];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickr=a=>a[Math.random()*a.length|0];

/* ശബ്ദം */
let voice=null;
function pv(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^ml([-_]|$)/i.test(x.lang))||v.find(x=>/malayalam/i.test(x.name))||null;if(voice)$('#vnote').hidden=true}
try{speechSynthesis.onvoiceschanged=pv;pv();setTimeout(()=>{pv();$('#vnote').hidden=!!voice},2500)}catch(e){}
function say(t,q){try{const sp=speechSynthesis;if(!q)sp.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ml-IN';if(voice)u.voice=voice;u.rate=.75;u.pitch=1.1;u.volume=1;window._u=u;if(sp.paused)sp.resume();setTimeout(()=>sp.speak(u),q?0:80)}catch(e){}}

function boom(){for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=pickr(['🎉','⭐','✨','🎈','🌟','🎊']);s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function setStars(n){stars=n;$('#st').textContent=n;try{localStorage.setItem('mls',n)}catch(e){}}

/* കളി */
let queue=[],cur,slots,tiles,model=false,locked=false,phase=0,started=false;
const COL=['#ff7a2f','#6c5ce7','#2fb344','#e5484d','#0984e3'];
const GR=[['#ff9a9e','#fbb1a0'],['#a18cd1','#f78fb3'],['#4fd18b','#4facfe'],['#f6a623','#fd6585'],['#4facfe','#8e7cf8']];
const cw=w=>ak(w).map((a,i)=>`<span style="color:${COL[i%5]}">${a}</span>`).join('');
const pic=c=>{if(cur.e)return `<div class="pic ${c}">${cur.e}</div>`;const g=GR[cur.w.length%5];return `<div class="ph ${c}" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${ak(cur.w)[0]}</div>`};
function nextWord(){
  if(!queue.length)queue=shuf(words());
  cur=queue.pop();locked=false;phase=0;model=false;
  const a=ak(cur.w);
  const others=[...new Set(shuf(words().flatMap(x=>ak(x.w))).filter(x=>!a.includes(x)))].slice(0,a.length>3?3:2);
  tiles=shuf(a.concat(others)).map((t,i)=>({t,i,used:false}));
  slots=a.map(()=>null);
  draw();
}
function draw(){
  const A=$('#a');
  if(!started){
    A.innerHTML=`<div class="pic">🦉</div><div class="model">നമുക്ക് പഠിക്കാം!</div><button class="big" id="go">▶️ തുടങ്ങാം</button>`;
    $('#go').onclick=()=>{started=true;draw()};return;
  }
  if(phase===0){
    A.innerHTML=`${pic('')}<div class="model">${cw(cur.w)}</div><div class="msg">👀 നോക്കൂ &nbsp; 👂 കേൾക്കൂ</div>
    <div class="row"><button class="big" id="hear">🔊 കേൾക്കൂ</button><button class="big alt" id="go2">✏️ ഇനി എഴുതാം</button></div>`;
    $('#hear').onclick=()=>say(cur.w);$('#go2').onclick=()=>{phase=1;draw()};return;
  }
  A.innerHTML=`${pic('sm')}
  <div class="model" ${model?'':'hidden'}>${cw(cur.w)}</div>
  <div class="row" id="sl"></div><div class="msg" id="mg">കേട്ട ആ വാക്ക് ഉണ്ടാക്കൂ 👇</div>
  <div class="row" id="tl"></div>
  <div class="row"><button class="big" id="hear">🔊</button><button class="big alt" id="hint">💡 സഹായം</button><button class="big gray" id="eye">👀 ${model?'മറയ്ക്കൂ':'നോക്കൂ'}</button><button class="big gray" id="skip">➡️</button></div>`;
  slots.forEach((v,i)=>{const b=document.createElement('div');b.className='slot'+(v!==null?' f':'');b.textContent=v!==null?tiles[v].t:'';b.onclick=()=>{if(locked||v===null)return;tiles[v].used=false;slots[i]=null;draw()};$('#sl').appendChild(b)});
  tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='tile'+(t.used?' used':'');b.textContent=t.t;b.onclick=()=>put(i);$('#tl').appendChild(b)});
  $('#hear').onclick=()=>say(cur.w);$('#skip').onclick=nextWord;
  $('#eye').onclick=()=>{model=!model;draw()};$('#hint').onclick=hint;
}
function put(i){
  if(locked||tiles[i].used)return;
  const k=slots.indexOf(null);if(k<0)return;
  slots[k]=i;tiles[i].used=true;
  if(slots.indexOf(null)<0)check();else draw();
}
function hint(){
  if(locked)return;const a=ak(cur.w);
  slots.forEach((v,i)=>{if(v!==null&&tiles[v].t!==a[i]){tiles[v].used=false;slots[i]=null}});
  const k=slots.indexOf(null);if(k<0)return;
  const j=tiles.findIndex(t=>!t.used&&t.t===a[k]);if(j>=0){slots[k]=j;tiles[j].used=true}
  if(slots.indexOf(null)<0)check();else draw();
}
function check(){
  draw();locked=true;const m=$('#mg');
  const got=slots.map(i=>tiles[i].t).join('');
  if(got===cur.w){
    const p=pickr(PR);
    m.className='msg ok';m.textContent='🎉 '+p;boom();setStars(stars+1);
    $('#skip').textContent='➡️ അടുത്തത്';$('#skip').className='big';
  }else{
    const p='ശരിയായില്ല. ഒന്നുകൂടി നോക്കൂ!';
    m.className='msg bad';m.textContent='🤔 '+p;$('#sl').classList.add('shake');
    setTimeout(()=>{slots=slots.map(()=>null);tiles.forEach(t=>t.used=false);locked=false;draw()},1400);
  }
}

/* സ്വന്തം വാക്ക് */
const V='അആഇഈഉഊഋഎഏഐഒഓഔ',C='കഖഗഘങചഛജഝഞടഠഡഢണതഥദധനപഫബഭമയരലവശഷസഹളഴറ',S='ാിീുൂൃെേൈൊോൗ്ംഃൽൾൺൻർ';
function pal(id,str){[...str].forEach(c=>{const b=document.createElement('button');b.textContent=(/[\u0D3E-\u0D57\u0D02\u0D03]/.test(c)?'◌':'')+c;b.onclick=()=>{$('#fi').value+=c};$(id).appendChild(b)})}
pal('#pv',V);pal('#pc',C);pal('#ps',S);
$('#fsay').onclick=()=>say($('#fi').value||'എഴുതൂ');
$('#fbk').onclick=()=>{const a=ak($('#fi').value);a.pop();$('#fi').value=a.join('')};
$('#fsp').onclick=()=>$('#fi').value+=' ';
$('#fcl').onclick=()=>$('#fi').value='';

/* അക്ഷരം വരയ്ക്കൽ */
const PR=['കൊള്ളാം! ശരിയാണ്!','വളരെ നന്നായി!','അടിപൊളി!','അഭിനന്ദനങ്ങൾ!','സൂപ്പർ!'];
const LET=[...V,...C,...'ൺൻർൽൾ'];let li=0,lph=0,lok=false;const N=360;
const FNT="800 250px 'Noto Sans Malayalam','Manjari','Kartika',sans-serif";
function mk(w){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.font=FNT;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.fillStyle=x.strokeStyle='#000';if(w){x.lineWidth=w;x.strokeText(LET[li],N/2,N/2+10)}x.fillText(LET[li],N/2,N/2+10);return x.getImageData(0,0,N,N).data}
function lDraw(){
  const D=$('#d'),L=LET[li];lok=false;
  if(lph===0){
    D.innerHTML=`<div class="model" style="font-size:clamp(110px,40vw,200px);line-height:1.1"><span style="color:${COL[li%5]}">${L}</span></div><div class="msg">👀 അക്ഷരം നോക്കൂ</div><div class="row"><button class="big" id="lh">🔊 കേൾക്കൂ</button><button class="big alt" id="lg">✏️ വരയ്ക്കാം</button></div>`;
    $('#lh').onclick=()=>say(L);$('#lg').onclick=()=>{lph=1;lDraw()};return;
  }
  D.innerHTML=`<div class="msg" id="lm">വിരൽ കൊണ്ട് അക്ഷരത്തിന് മീതെ വരയ്ക്കൂ ✏️</div><div class="cv" id="cv"><canvas id="cg" width="${N}" height="${N}"></canvas><canvas id="cd" width="${N}" height="${N}"></canvas></div><div class="row"><button class="big" id="lh">🔊 കേൾക്കൂ</button><button class="big gray" id="lc">🧽 മായ്ക്കൂ</button><button class="big alt" id="lk">✅ നോക്കൂ</button><button class="big gray" id="ln">➡️</button></div>`;
  const cd=$('#cd'),dx=cd.getContext('2d');dx.lineWidth=30;dx.lineCap=dx.lineJoin='round';
  (document.fonts?document.fonts.load("800 40px 'Noto Sans Malayalam'",L):Promise.resolve()).catch(()=>{}).then(()=>{
    const g=$('#cg');if(!g)return;const x=g.getContext('2d');x.font=FNT;x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='#e6ebff';x.fillText(L,N/2,N/2+10);x.setLineDash([8,8]);x.strokeStyle='#8f9be0';x.lineWidth=3;x.strokeText(L,N/2,N/2+10)});
  const pt=e=>{const r=cd.getBoundingClientRect();return[(e.clientX-r.left)*N/r.width,(e.clientY-r.top)*N/r.height]};
  let last=null,hue=0;
  cd.onpointerdown=e=>{if(lok)return;e.preventDefault();cd.setPointerCapture(e.pointerId);last=pt(e);dx.fillStyle=dx.strokeStyle=`hsl(${hue},80%,55%)`;dx.beginPath();dx.arc(last[0],last[1],15,0,7);dx.fill()};
  cd.onpointermove=e=>{if(!last)return;const q=pt(e);hue=(hue+3)%360;dx.strokeStyle=`hsl(${hue},80%,55%)`;dx.beginPath();dx.moveTo(last[0],last[1]);dx.lineTo(q[0],q[1]);dx.stroke();last=q};
  cd.onpointerup=cd.onpointercancel=()=>{last=null};
  const clr=()=>dx.clearRect(0,0,N,N);
  $('#lh').onclick=()=>say(L);$('#lc').onclick=()=>{if(!lok)clr()};
  $('#ln').onclick=()=>{li=(li+1)%LET.length;lph=0;lDraw()};
  $('#lk').onclick=()=>{
    if(lok)return;const m=$('#lm'),k=dx.getImageData(0,0,N,N).data;
    const a0=mk(0),dm=mk(34);let a=0,b=0,c=0,d=0;
    for(let i=3;i<k.length;i+=4){const ik=k[i]>40;if(a0[i]>40){a++;if(ik)b++}if(ik){c++;if(dm[i]>40)d++}}
    if(c<300){m.className='msg bad';m.textContent='ആദ്യം അക്ഷരത്തിന് മീതെ വരയ്ക്കൂ ✏️';return}
    if(b/a>.5&&d/c>.7){lok=true;m.className='msg ok';m.textContent='🎉 '+pickr(PR)+' ഇനി കേൾക്കൂ 👇';boom();setStars(stars+1);$('#lh').className='big alt';$('#ln').className='big';$('#ln').textContent='➡️ അടുത്തത്'}
    else{m.className='msg bad';m.textContent='🤔 ശരിയായില്ല. വീണ്ടും ശ്രമിക്കൂ!';$('#cv').classList.add('shake');setTimeout(()=>{clr();$('#cv').classList.remove('shake');m.className='msg';m.textContent='അക്ഷരത്തിന് മീതെ വരയ്ക്കൂ ✏️'},1500)}
  };
}

/* ടാബുകൾ */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['a','b','d'].forEach(id=>$('#'+id).hidden=id!==b.dataset.t);
});
setStars(stars);nextWord();lDraw();
</script>
</body>
</html>
